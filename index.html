<style>
/* Layout idea: one working column, sticky tab bar, dense tables that scroll sideways inside their own cards. */
:root{

  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --surface:#181c25; --ink:#eef1f6; --muted:#a8b1c0; --line:#2c3342;
    --accent:#8fb0ff; --accent-ink:#0b1530; --soft:#1f2738;

  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#181c25; --ink:#eef1f6; --muted:#a8b1c0; --line:#2c3342;
  --accent:#8fb0ff; --accent-ink:#0b1530; --soft:#1f2738;
  --warn:#f0b35a; --warn-bg:#33270f; --crit:#ff8d80; --crit-bg:#3a1a16; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px 8px;max-width:1200px;margin:0 auto}
h1{font:700 24px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h1 small{font:500 13px var(--body);color:var(--muted);margin-left:8px;letter-spacing:0}
h2{font:600 18px/1.2 var(--display);margin:0;text-wrap:balance}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav div{display:flex;gap:4px;max-width:1200px;margin:0 auto;padding:6px 16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);font:600 15px var(--body);padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
nav .tn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:12px;margin-right:6px}
nav button[aria-current="true"] .tn{background:var(--accent-ink);color:var(--accent)}
nav .setb{margin-left:auto;border:1px solid var(--line)}
.subnav{display:flex;flex-wrap:wrap;gap:6px}
tr.sub td{background:var(--bg);padding:0}tr.sub table{font-size:14px}tr.sub td td{padding:6px 10px 6px 28px}
tr.tap:hover td{background:var(--soft)}
main{max-width:1200px;margin:0 auto;padding:16px 16px 60px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.hint{color:var(--muted);font-size:13px;margin:0;max-width:70ch}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:90px;text-align:right}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
td input[type=number]{width:78px;padding:6px 8px;min-height:40px;font-weight:600}
td input[type=text]{width:100%;min-width:120px;padding:5px 8px;min-height:32px}
td select{padding:5px 6px;min-height:32px;max-width:220px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:38px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.danger{color:var(--crit)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:170px}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--soft);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
th .src{display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:flex-end;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}th .src .off{text-decoration:line-through;opacity:.6}
tr.tap{cursor:pointer}tr.tap td{padding:12px 10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps button{display:flex;align-items:center;gap:10px;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 16px var(--body);padding:12px 8px;border-radius:12px;cursor:pointer}
.steps button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:14px;flex:none}
.stp{display:inline-flex;gap:6px;align-items:center}
.stp button{width:42px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:600 20px var(--body);cursor:pointer}
td.num b{font-weight:600}
.ov{border-color:var(--accent)!important;background:var(--soft)!important;font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tile b{font:700 24px/1.2 var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-weight:500}
.two{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.list{display:grid;gap:2px;max-height:70vh;overflow:auto}
.list button{text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:7px 10px;border-radius:8px;cursor:pointer}
.list button[aria-current="true"]{background:var(--soft);font-weight:600;color:var(--accent)}
.list .g{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 10px 2px}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.muted{color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--surface);color:var(--muted);font:600 13px var(--body);padding:7px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){.two{grid-template-columns:1fr}.list{max-height:220px}h1 small{display:block;margin:4px 0 0}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,nav button{transition:background .12s}}
[hidden]{display:none!important}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync{font-size:12px;color:var(--muted)}.sync.bad{color:var(--crit);font-weight:600}
#auth{max-width:400px;margin:10vh auto;padding:0 16px}
#auth .card{gap:10px}#auth input{width:100%}#auth .lnk{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:4px 0;justify-self:start}
#auth .err{color:var(--crit);min-height:1.2em;margin:0;font-size:14px}#auth .ok{color:var(--accent);margin:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:20;max-width:90vw}
#teamRoot.ta{--ta-accent:var(--accent);--ta-accent-ink:var(--accent-ink);--ta-ink:var(--ink);--ta-muted:var(--muted);--ta-line:var(--line);--ta-soft:var(--soft);--ta-bg:var(--surface);font-family:var(--body);max-width:none}
#teamRoot.ta h1{font:600 18px/1.2 var(--display)}
</style>

function rowsOf(X){const o={ingredients:{},recipes:{},sales:{},name_map:{},special_days:{},plan_settings:{}};
 for(const k in X.ings)o.ingredients[k]=JSON.stringify(X.ings[k]);
 for(const k in X.recs)o.recipes[k]=JSON.stringify(X.recs[k]);
 for(const d in X.sales)for(const i in X.sales[d])if(X.sales[d][i]>0)o.sales[d+'|'+i]=String(X.sales[d][i]);
 for(const k in X.map||{})o.name_map[k]=String(X.map[k]);
 for(const d in X.tags)o.special_days[d]=JSON.stringify(X.tags[d]);
 if(X.plan)o.plan_settings.plan=JSON.stringify(X.plan);o.plan_settings.overrides=JSON.stringify(X.overrides||{});o.plan_settings.meta=JSON.stringify({v:X.v||0,sample:!!X.sample});
 return o}
function rowFor(tb,k,v){if(tb==='ingredients'||tb==='recipes')return {id:k,data:JSON.parse(v)};
 if(tb==='sales'){const i=k.indexOf('|');return {day:k.slice(0,i),item_id:k.slice(i+1),qty:+v}}
 if(tb==='name_map')return {square_name:k,target:v};if(tb==='special_days')return {day:k,data:JSON.parse(v)};return {key:k,data:JSON.parse(v)}}
const PK={ingredients:'id',recipes:'id',sales:'day,item_id',name_map:'square_name',special_days:'day',plan_settings:'key'};

async function push(){if(!base)return;const cur=rowsOf(S);
 for(const tb in cur){if(!can(WRITE[tb],'edit'))continue;const a=cur[tb],b=base[tb],up=[],gone=[];
  for(const k in a)if(a[k]!==b[k])up.push(k);for(const k in b)if(!(k in a))gone.push(k);
  if(!up.length&&!gone.length)continue;
  for(let n=0;n<up.length;n+=500){const part=up.slice(n,n+500);const {error}=await sb.from(tb).upsert(part.map(k=>rowFor(tb,k,a[k])),{onConflict:PK[tb]});if(error)throw error;part.forEach(k=>b[k]=a[k])}
  if(!gone.length)continue;
  if(can(WRITE[tb],'delete')){
   if(tb==='sales'){const by={};gone.forEach(k=>{const i=k.indexOf('|');(by[k.slice(0,i)]=by[k.slice(0,i)]||[]).push(k.slice(i+1))});
    for(const d in by){const {error}=await sb.from('sales').delete().eq('day',d).in('item_id',by[d]);if(error)throw error}}
   else{const {error}=await sb.from(tb).delete().in(PK[tb],gone);if(error)throw error}
   gone.forEach(k=>delete b[k])}
  else if(tb==='sales'){/* may change but not delete: a removed number is saved as 0 */
   const {error}=await sb.from('sales').upsert(gone.map(k=>rowFor('sales',k,'0')),{onConflict:PK.sales});if(error)throw error;gone.forEach(k=>delete b[k])}
  else gone.forEach(k=>delete b[k])}}
function save(){try{localStorage.setItem(KEY+'.view',JSON.stringify({from:sFrom,to:sTo,lang:S.lang,tab}))}catch(e){}
 if(!base)return;lastEdit=Date.now();pending++;syncState='saving';showSync();
 queue=queue.then(push).then(()=>{if(!--pending){syncState='';showSync()}},async e=>{pending=0;syncState='bad';toast(t('saveErr')+' '+((e&&e.message)||e));await reload(true)})}
function showSync(){const el=document.querySelector('#who .sync');if(el){el.className='sync'+(syncState==='bad'?' bad':'');el.textContent=syncState==='saving'?t('saving'):''}}

async function fetchAll(tb){let out=[];for(let from=0;;from+=1000){const {data,error}=await sb.from(tb).select('*').range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break}return out}
async function pull(){const [ings,recs,sales,map,days,ps]=await Promise.all(['ingredients','recipes','sales','name_map','special_days','plan_settings'].map(fetchAll));
 const X={lang:S?S.lang:'tr',ings:{},recs:{},sales:{},map:{},tags:{},overrides:{},plan:null,v:0,sample:false};
 ings.forEach(r=>X.ings[r.id]=r.data);recs.forEach(r=>X.recs[r.id]=r.data);
 sales.forEach(r=>{const q2=+r.qty;if(q2>0)(X.sales[r.day]=X.sales[r.day]||{})[r.item_id]=q2});
 map.forEach(r=>X.map[r.square_name]=r.target);days.forEach(r=>X.tags[r.day]=r.data);
 ps.forEach(r=>{if(r.key==='plan')X.plan=r.data;else if(r.key==='overrides')X.overrides=r.data||{};else if(r.key==='meta'){X.v=(r.data&&r.data.v)||0;X.sample=!!(r.data&&r.data.sample)}});
 return X}
/* reads everything again; keeps this device's own plan dates for people who may not change the shared plan */
async function reload(quiet){try{const X=await pull(),lang=S.lang,myPlan=S.plan;base=rowsOf(X);
  if(!Object.keys(X.recs).length&&can('recipes','view')){await firstFill(X);return}
  const D=seed();X.plan=X.plan||D.plan;X.plan.ingBuffer=X.plan.ingBuffer||{};
  const v0=X.v;S=migrate(X);S.lang=lang;if(!can('plan','edit')&&myPlan&&booted)S.plan=myPlan;
  if(!S.recs[selRec])selRec=Object.keys(S.recs)[0];
  if(S.v!==v0&&can('recipes','edit'))save();
  if(!quiet||!document.activeElement||!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))render(true)}
 catch(e){toast(t('loadErr')+' '+((e&&e.message)||e))}}
/* an empty database: the first admin fills it with the starting recipes and ingredients */
async function firstFill(X){if(!(can('recipes','edit')&&can('ingredients','edit'))){document.getElementById('app').innerHTML=`<section class="card"><p>${t('emptyDb')}</p></section>`;return}
 const lang=S.lang;S=seed();S.lang=lang;S.sales={};S.sample=false;S.overrides={};base=rowsOf(X);render();save();
 await queue;if(syncState!=='bad')toast(t('seeded'))}

async function teamApi(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error(t('signIn'));
 const r=await fetch(TEAM_FN,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token,apikey:SB_KEY},body:JSON.stringify(body)});
 let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}

/* sign-in screens */
function authBox(html){document.getElementById('nav').hidden=true;document.getElementById('app').innerHTML='';const w=document.getElementById('who');if(w)w.hidden=true;document.getElementById('auth').innerHTML=html}
function showLogin(note){authBox(`<form class="card" id="loginF"><h2>${t('signIn')}</h2>
 <label class="f">${t('email')}<input id="lEmail" type="email" autocomplete="username" required></label>
 <label class="f">${t('password')}<input id="lPw" type="password" autocomplete="current-password" required></label>
 <button class="btn pri" type="submit">${t('signIn')}</button><p class="err" id="lErr" role="alert"></p>${note?`<p class="ok">${esc(note)}</p>`:''}
 <button class="lnk" type="button" id="lForgot">${t('forgot')}</button></form>`);
 document.getElementById('loginF').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('lErr');er.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById('lEmail').value.trim(),password:document.getElementById('lPw').value});if(error)er.textContent=t('badLogin')};
 document.getElementById('lForgot').onclick=async()=>{const em=document.getElementById('lEmail').value.trim(),er=document.getElementById('lErr');if(!em){er.textContent=t('email')+'?';return}
  await sb.auth.resetPasswordForEmail(em,{redirectTo:APP_URL});showLogin(t('resetSent'))}}
function showSetPw(){authBox(`<form class="card" id="pwF"><h2>${t('setPw')}</h2>
 <label class="f">${t('newPw')}<input id="nPw" type="password" minlength="8" autocomplete="new-password" required></label>
 <button class="btn pri" type="submit">${t('savePw')}</button><p class="err" id="pErr" role="alert"></p></form>`);
 document.getElementById('pwF').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:document.getElementById('nPw').value});
  if(error){document.getElementById('pErr').textContent=error.message;return}needPw=false;history.replaceState(null,'',location.pathname);start()}}
let needPw=/type=(invite|recovery)/.test(location.hash);
let starting=null;function start(){if(!starting)starting=start2().finally(()=>starting=null);return starting}
async function start2(){const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}
 me=session.user;perms=(me.app_metadata&&me.app_metadata.perms)||{};if(needPw){showSetPw();return}
 document.getElementById('auth').innerHTML='';
 if(!RUNGS.slice(1).some(r=>Object.values(perms).includes(r))){authBox(`<section class="card"><p>${t('noAccess')}</p><button class="btn" data-act="logout">${t('signOut')}</button></section>`);return}
 document.getElementById('nav').hidden=false;document.getElementById('app').innerHTML=`<section class="card"><p>${t('loading')}</p></section>`;
 await reload(false);booted=true}

/* every button and field is checked before the app acts on it */
['change','click'].forEach(type=>document.addEventListener(type,e=>{const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
 if(a==='logout'){e.stopImmediatePropagation();base=null;sb.auth.signOut();return}
 if(!base){e.stopImmediatePropagation();if(a==='lang'&&type==='click'){S.lang=el.dataset.v;try{const v=JSON.parse(localStorage.getItem(KEY+'.view')||'{}');v.lang=S.lang;localStorage.setItem(KEY+'.view',JSON.stringify(v))}catch(x){}['tr','en'].forEach(l=>document.getElementById('lang-'+l).setAttribute('aria-pressed',S.lang===l));if(document.getElementById('loginF'))showLogin();else if(document.getElementById('pwF'))showSetPw()}return}
 if(type==='click'&&(el.tagName==='INPUT'||el.tagName==='SELECT'))return;
 if(!allowed(a)){e.stopImmediatePropagation();e.preventDefault();toast(t('noPerm'));render(true)}},true));

(function boot(){S=seed();S.lang='tr';salesDate=addD(fmt(new Date()),-1);sTo=salesDate;sFrom=salesDate;
 try{const v=JSON.parse(localStorage.getItem(KEY+'.view')||'{}');if(v.lang)S.lang=v.lang;if(v.from&&v.to){sFrom=v.from;sTo=v.to;salesDate=sFrom}if(v.tab)tab=v.tab}catch(e){}
 ['tr','en'].forEach(l=>document.getElementById('lang-'+l).setAttribute('aria-pressed',S.lang===l));
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY')needPw=true;
  if(ev==='SIGNED_OUT'){me=null;base=null;showLogin()}
  else if(ev==='SIGNED_IN'&&!me)setTimeout(start,0)
  else if(ev==='TOKEN_REFRESHED'&&session&&me){const np=(session.user.app_metadata&&session.user.app_metadata.perms)||{};if(JSON.stringify(np)!==JSON.stringify(perms)){perms=np;render(true)}}});
 start();
 /* other people's changes come in when the tab is looked at again, and every 2 minutes while idle */
 let lastPull=Date.now();const fresh=()=>{if(!base||document.visibilityState!=='visible'||pending||imp||Date.now()-lastEdit<20000)return;if(Date.now()-lastPull<60000)return;lastPull=Date.now();sb.auth.refreshSession().catch(()=>{});queue=queue.then(()=>reload(true))};
 document.addEventListener('visibilitychange',fresh);window.addEventListener('focus',fresh);setInterval(fresh,120000)})();
</script>
